<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>타겟 슈팅 게임</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #2b2b3a 0%, #1a1a24 100%);
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    user-select: none;
  }

  #gameCanvas {
    display: block;
    cursor: crosshair;
  }

  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    color: #fff;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  #hud span {
    background: rgba(0,0,0,0.35);
    padding: 8px 16px;
    border-radius: 8px;
  }

  #timeBox.warning {
    color: #ff5555;
  }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.72);
    color: #fff;
    text-align: center;
  }

  #overlay h1 {
    font-size: 42px;
    margin-bottom: 8px;
  }

  #overlay p {
    font-size: 18px;
    opacity: 0.85;
    margin: 4px 0;
  }

  #overlay button {
    margin-top: 24px;
    padding: 14px 36px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #ff4757;
    color: #fff;
    cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }

  #overlay button:hover {
    background: #ff6b81;
    transform: scale(1.05);
  }

  .hidden {
    display: none !important;
  }

  #hitFx {
    position: absolute;
    font-size: 24px;
    font-weight: bold;
    color: #ffd23f;
    pointer-events: none;
    animation: floatUp 0.6s ease-out forwards;
  }

  @keyframes floatUp {
    from { opacity: 1; transform: translateY(0); }
    to   { opacity: 0; transform: translateY(-40px); }
  }
</style>
</head>
<body>

<div id="hud">
  <span id="scoreBox">점수: 0</span>
  <span id="timeBox">시간: 30</span>
</div>

<canvas id="gameCanvas"></canvas>

<div id="overlay">
  <h1>🎯 타겟 슈팅</h1>
  <p>제한 시간 안에 검은 사람 모양 타겟을 최대한 많이 맞추세요!</p>
  <p>마우스로 조준하고 클릭하여 사격합니다.</p>
  <button id="startBtn">게임 시작</button>
</div>

<script>
(function () {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreBox = document.getElementById('scoreBox');
  const timeBox = document.getElementById('timeBox');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const GAME_TIME = 30; // 초
  let score = 0;
  let timeLeft = GAME_TIME;
  let running = false;
  let timerId = null;
  let spawnId = null;
  let targets = [];

  function rand(min, max) {
    return Math.random() * (max - min) + min;
  }

  // 사람 모양(간단한 실루엣) 타겟 클래스
  class Target {
    constructor() {
      this.scale = rand(0.7, 1.2);
      this.width = 46 * this.scale;
      this.height = 100 * this.scale;
      this.x = rand(this.width, W - this.width);
      this.y = rand(this.height, H - this.height - 40);
      this.alive = true;
      this.hitAnim = 0;
      this.spawnAnim = 0;
      this.sway = rand(0, Math.PI * 2);
      this.swaySpeed = rand(0.02, 0.05);
    }

    update() {
      this.spawnAnim = Math.min(1, this.spawnAnim + 0.08);
      this.sway += this.swaySpeed;
      if (this.hitAnim > 0) this.hitAnim -= 0.06;
    }

    containsPoint(px, py) {
      // 대략적인 사람 모양 히트박스 (머리+몸통 사각/원 근사)
      const cx = this.x;
      const headY = this.y - this.height * 0.36;
      const headR = this.width * 0.28;
      // 머리
      const dHead = Math.hypot(px - cx, py - headY);
      if (dHead <= headR) return true;
      // 몸통
      const bodyTop = this.y - this.height * 0.15;
      const bodyBottom = this.y + this.height * 0.5;
      const bodyHalfW = this.width * 0.42;
      if (px >= cx - bodyHalfW && px <= cx + bodyHalfW &&
          py >= bodyTop && py <= bodyBottom) return true;
      return false;
    }

    draw() {
      const s = this.spawnAnim;
      const hit = this.hitAnim;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(s, s);
      ctx.rotate(Math.sin(this.sway) * 0.03);

      ctx.fillStyle = hit > 0 ? `rgba(255,60,60,${0.5 + hit})` : '#111111';
      ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.lineWidth = 2;

      const w = this.width;
      const h = this.height;

      // 머리
      ctx.beginPath();
      ctx.arc(0, -h * 0.36, w * 0.28, 0, Math.PI * 2);
      ctx.fill();

      // 몸통 (사다리꼴 느낌의 실루엣)
      ctx.beginPath();
      ctx.moveTo(-w * 0.18, -h * 0.15);
      ctx.lineTo(w * 0.18, -h * 0.15);
      ctx.lineTo(w * 0.42, h * 0.5);
      ctx.lineTo(-w * 0.42, h * 0.5);
      ctx.closePath();
      ctx.fill();

      // 팔
      ctx.beginPath();
      ctx.moveTo(-w * 0.18, -h * 0.1);
      ctx.lineTo(-w * 0.5, h * 0.15);
      ctx.lineTo(-w * 0.38, h * 0.18);
      ctx.lineTo(-w * 0.14, -h * 0.02);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(w * 0.18, -h * 0.1);
      ctx.lineTo(w * 0.5, h * 0.15);
      ctx.lineTo(w * 0.38, h * 0.18);
      ctx.lineTo(w * 0.14, -h * 0.02);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }
  }

  function spawnTarget() {
    if (targets.length < 6) {
      targets.push(new Target());
    }
  }

  function showHitFx(x, y, text) {
    const el = document.createElement('div');
    el.id = 'hitFx';
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 600);
  }

  canvas.addEventListener('click', (e) => {
    if (!running) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    let hitSomething = false;
    for (let i = targets.length - 1; i >= 0; i--) {
      const t = targets[i];
      if (t.alive && t.containsPoint(mx, my)) {
        t.alive = false;
        t.hitAnim = 1;
        score += 10;
        scoreBox.textContent = '점수: ' + score;
        showHitFx(e.clientX, e.clientY, '+10');
        hitSomething = true;
        setTimeout(() => {
          targets = targets.filter(x => x !== t);
        }, 120);
        break;
      }
    }
    if (!hitSomething) {
      showHitFx(e.clientX, e.clientY, 'MISS');
    }
  });

  function loop() {
    ctx.clearRect(0, 0, W, H);

    // 배경 격자 느낌
    ctx.fillStyle = '#22222e';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let gx = 0; gx < W; gx += 40) {
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, H);
      ctx.stroke();
    }

    targets.forEach(t => {
      t.update();
      t.draw();
    });

    if (running) requestAnimationFrame(loop);
  }

  function startGame() {
    score = 0;
    timeLeft = GAME_TIME;
    targets = [];
    scoreBox.textContent = '점수: 0';
    timeBox.textContent = '시간: ' + timeLeft;
    timeBox.classList.remove('warning');
    overlay.classList.add('hidden');
    running = true;

    for (let i = 0; i < 3; i++) spawnTarget();

    spawnId = setInterval(spawnTarget, 900);
    timerId = setInterval(() => {
      timeLeft--;
      timeBox.textContent = '시간: ' + timeLeft;
      if (timeLeft <= 10) timeBox.classList.add('warning');
      if (timeLeft <= 0) endGame();
    }, 1000);

    requestAnimationFrame(loop);
  }

  function endGame() {
    running = false;
    clearInterval(timerId);
    clearInterval(spawnId);

    overlay.innerHTML = `
      <h1>게임 종료!</h1>
      <p>최종 점수: <strong>${score}</strong></p>
      <button id="restartBtn">다시 시작</button>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('restartBtn').addEventListener('click', startGame);
  }

  startBtn.addEventListener('click', startGame);
})();
</script>

</body>
</html>
